[tool.poetry]
name = "aidial-adapter-bedrock"
version = "0.28.0rc"
description = "DIAL adapter for AWS Bedrock"
authors = ["EPAM RAIL <SpecialEPM-DIALDevTeam@epam.com>"]
homepage = "https://epam-rail.com"
documentation = "https://epam-rail.com/dial_api"
license = "Apache-2.0"
readme = "README.md"
keywords = ["ai"]
classifiers = ["Topic :: Software Development :: Libraries :: Python Modules"]
repository = "https://github.com/epam/ai-dial-adapter-bedrock/"

[tool.poetry.dependencies]
python = "^3.11,<4.0"
boto3 = "1.37.24"
botocore = "1.37.24"
aidial-sdk = { version = "0.21.0", extras = ["telemetry"] }
anthropic = { version = "0.49.0", extras = ["bedrock"] }
# Only for the tokenizer for Claude v1/v2 models
anthropic_bedrock = "0.8.0"
fastapi = "0.115.2"
openai = "1.13.3"
uvicorn = "0.23.2"
pydantic = "1.10.17"
defusedxml = "^0.7.1"
numpy = "^2.0.0"
pillow = "^10.4.0"
aiohttp = "^3.10.11"

[tool.poetry.group.test.dependencies]
pytest-asyncio = "0.21.1"
pytest = "7.4.0"
python-dotenv = "1.0.0"
pytest-dotenv = "^0.5.2"
pytest-xdist = "^3.5.0"
pytest-html = "^4.1.1"
pytest-sugar = "^1.0.0"
respx = "^0.22.0"
allure-pytest = "^2.13.5"

[tool.poetry.group.lint.dependencies]
pyright = "1.1.389"
black = "24.3.0"
isort = "5.12.0"
autoflake = "2.2.0"
flake8 = "6.0.0"

[tool.poetry.group.dev.dependencies]
nox = "^2023.4.22"

[tool.pytest.ini_options]
addopts = "-n=auto --asyncio-mode=auto --self-contained-html --html=pytest.html --alluredir=allure-results"
generate_report_on_test = true
env_override_existing_values = 1
testpaths = ["tests"]
filterwarnings = [
  "error",
  # muting warnings like this: ResourceWarning: unclosed <socket.socket fd=13...
  "ignore::ResourceWarning:",
  # muting warnings coming from opentelemetry package
  "ignore::DeprecationWarning:opentelemetry.instrumentation.dependencies",
]

[tool.pyright]
typeCheckingMode = "basic"
reportDeprecated = "error"
reportUnusedVariable = "error"
reportIncompatibleMethodOverride = "error"
exclude = [".git", ".venv", ".nox", "**/__pycache__", "allure-results"]

[tool.black]
line-length = 80
exclude = '''
/(
    \.git
  | \.venv
  | \.nox
  | \.__pycache__
  | allure-results
)/
'''

[tool.isort]
line_length = 80
profile = "black"
skip = [".venv", ".nox", "allure-results"]

[tool.autoflake]
ignore_init_module_imports = true
remove_all_unused_imports = true
in_place = true
recursive = true
quiet = true
exclude = ["\\.venv", "\\.nox", "allure-results"]
