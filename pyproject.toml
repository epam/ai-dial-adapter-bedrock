[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "aidial-adapter-bedrock"
version = "0.0.0"
description = "DIAL adapter for AWS Bedrock"
authors = [{ name = "EPAM RAIL", email = "SpecialEPM-DIALDevTeam@epam.com" }]
license = "Apache-2.0"
readme = "README.md"
keywords = ["ai"]
classifiers = ["Topic :: Software Development :: Libraries :: Python Modules"]
requires-python = ">=3.11,<4.0"
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://epam-rail.com"
Documentation = "https://epam-rail.com/dial_api"
Repository = "https://github.com/epam/ai-dial-adapter-bedrock/"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
aidial-adapter-anthropic = { "version" = "0.17.0", extras = ["bedrock"] }
boto3 = "1.43.56"
botocore = "1.43.56"
aidial-sdk = { version = "0.39.0", extras = ["telemetry"] }
anthropic = { version = "0.105.0", extras = ["bedrock"] }
fastapi = "0.135.1"
uvicorn = "0.23.2"
pydantic = "2.10.4"
numpy = "2.0.0"
pillow = "12.3.0"

[tool.poetry.group.test.dependencies]
openai = "1.107.3"
pytest-asyncio = "1.3.0"
pytest = "9.0.3"
python-dotenv = "1.2.2"
pytest-dotenv = "^0.5.2"
pytest-xdist = "^3.5.0"
pytest-html = "^4.1.1"
pytest-sugar = "^1.0.0"
pytest-timeout = "^2.3.1"
pytest-env = "1.1.1"
respx = "^0.22.0"
allure-pytest = "^2.13.5"
asgi-lifespan = "2.1.0"

[tool.poetry.group.lint.dependencies]
pyright = "1.1.389"
ruff = "0.12.11"

[tool.poetry.group.dev.dependencies]
nox = "^2023.4.22"
pre-commit = "^4.5.1"

[tool.pytest.ini_options]
addopts = "-n=auto --asyncio-mode=auto --self-contained-html --html=pytest.html --alluredir=allure-results --clean-alluredir --timeout=120"
env = ["PYDANTIC_V2=1"]
generate_report_on_test = true
env_override_existing_values = 1
testpaths = ["tests"]
filterwarnings = [
    "error",
    # muting warnings coming from opentelemetry package
    "ignore::DeprecationWarning:opentelemetry.instrumentation.dependencies",
    # UserWarning: Pydantic serializer warnings
    "ignore::UserWarning",
]

[tool.pyright]
typeCheckingMode = "basic"
reportDeprecated = "error"
reportUnusedVariable = "error"
reportIncompatibleMethodOverride = "error"


[tool.ruff]
target-version = "py311"
line-length = 80

[tool.ruff.lint]
select = [
    "ERA",  # flake8-eradicate
    "B",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "B9",   # flake8-bugbear
    "E",    # pycodestyle
    "W",    # pycodestyle
    "F",    # pyflakes
    "I",    # flake8-isort
    "S",    # flake8-bandit
    "FURB", # refurb,
    "UP",   # pyupgrade
]
ignore = [
    "E501", # string literal is too long
    "S101", # Use of `assert` detected
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "B011", # Do not `assert False`
]
