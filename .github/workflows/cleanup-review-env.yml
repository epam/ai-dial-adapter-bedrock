name: Cleanup review environment

on:
  pull_request:
    types:
      - closed

jobs:
  cleanup-review-environment:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup review environment
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.ACTIONS_BOT_TOKEN }}
          repository: epam/ai-dial-ci
          event-type: cleanup-review-environment
          client-payload: |-
            {
              "github-app": "${{github.event.repository.name}}",
              "github-pr": "${{github.event.pull_request.number}}"
            }
