name: Cleanup review environment

on:
  pull_request:
    types:
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    uses: epam/ai-dial-ci/.github/workflows/cleanup-review-environment.yml@destroy-on-pr-merged
    secrets: inherit
